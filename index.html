<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater Scene - 3D Navigation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
        }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 2000;
            max-width: 400px;
        }

        #instructions h2 {
            margin-bottom: 20px;
            color: #4fc3f7;
        }

        #instructions p {
            margin: 10px 0;
            line-height: 1.6;
        }

        #instructions button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background: #4fc3f7;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        #instructions button:hover {
            background: #0288d1;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <h2>🌊 Underwater Navigation</h2>
        <p><strong>WASD</strong> - Move forward/backward/left/right</p>
        <p><strong>SPACE</strong> - Swim up</p>
        <p><strong>SHIFT</strong> - Swim down</p>
        <p><strong>MOUSE</strong> - Look around</p>
        <p><strong>ESC</strong> - Release mouse</p>
        <button id="startBtn">Click to Start</button>
    </div>

    <div id="info">
        <div>Position: <span id="position">0, 0, 0</span></div>
        <div>Environment: <span id="environment">Underwater</span></div>
        <div>Depth: <span id="depth">0m</span></div>
    </div>

    <div id="crosshair"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new PointerLockControls(camera, document.body);

        // Movement variables
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const moveSpeed = 20;
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false,
            space: false,
            shift: false
        };

        // Water surface level
        const waterLevel = 0;
        camera.position.set(0, -20, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        const underwaterLight = new THREE.PointLight(0x4fc3f7, 0.5, 100);
        underwaterLight.position.set(0, -30, 0);
        scene.add(underwaterLight);

        // Ocean floor
        const floorGeometry = new THREE.PlaneGeometry(500, 500, 50, 50);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a4d2e,
            roughness: 0.9,
            metalness: 0.1
        });

        // Add some noise to the floor
        const floorPositions = floorGeometry.attributes.position;
        for (let i = 0; i < floorPositions.count; i++) {
            const z = floorPositions.getZ(i);
            floorPositions.setZ(i, z + Math.random() * 3);
        }
        floorGeometry.computeVertexNormals();

        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -50;
        scene.add(floor);

        // Water surface
        const waterGeometry = new THREE.PlaneGeometry(500, 500, 100, 100);
        const waterMaterial = new THREE.MeshStandardMaterial({
            color: 0x006994,
            transparent: true,
            opacity: 0.6,
            roughness: 0.1,
            metalness: 0.8,
            side: THREE.DoubleSide
        });

        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        water.rotation.x = -Math.PI / 2;
        water.position.y = waterLevel;
        scene.add(water);

        // Animate water surface
        const waterPositions = waterGeometry.attributes.position;
        const originalWaterPositions = new Float32Array(waterPositions.array);

        // Sky (visible above water)
        const skyGeometry = new THREE.SphereGeometry(400, 32, 32);
        const skyMaterial = new THREE.MeshBasicMaterial({
            color: 0x87ceeb,
            side: THREE.BackSide
        });
        const sky = new THREE.Mesh(skyGeometry, skyMaterial);
        sky.position.y = 200;
        scene.add(sky);

        // Sun
        const sunGeometry = new THREE.SphereGeometry(20, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        sun.position.set(100, 150, -100);
        scene.add(sun);

        // Clouds
        function createCloud(x, y, z) {
            const cloudGroup = new THREE.Group();
            const cloudGeometry = new THREE.SphereGeometry(5, 16, 16);
            const cloudMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.7
            });

            for (let i = 0; i < 5; i++) {
                const cloudPart = new THREE.Mesh(cloudGeometry, cloudMaterial);
                cloudPart.position.set(
                    Math.random() * 10 - 5,
                    Math.random() * 3,
                    Math.random() * 10 - 5
                );
                cloudPart.scale.set(
                    1 + Math.random(),
                    0.8 + Math.random() * 0.4,
                    1 + Math.random()
                );
                cloudGroup.add(cloudPart);
            }

            cloudGroup.position.set(x, y, z);
            return cloudGroup;
        }

        const clouds = [];
        for (let i = 0; i < 20; i++) {
            const cloud = createCloud(
                Math.random() * 400 - 200,
                50 + Math.random() * 50,
                Math.random() * 400 - 200
            );
            clouds.push(cloud);
            scene.add(cloud);
        }

        // Underwater particles (bubbles, plankton, debris)
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);
        const velocityArray = new Float32Array(particlesCount);

        for (let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 200;
            posArray[i + 1] = Math.random() * -100;
            posArray[i + 2] = (Math.random() - 0.5) * 200;
            velocityArray[i / 3] = Math.random() * 0.5 + 0.1;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.3,
            color: 0x4fc3f7,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Fish (simple moving objects)
        const fishGroup = new THREE.Group();
        function createFish(x, y, z) {
            const fishGeometry = new THREE.ConeGeometry(0.5, 2, 8);
            const fishMaterial = new THREE.MeshStandardMaterial({
                color: Math.random() * 0xffffff,
                emissive: 0x222222
            });
            const fish = new THREE.Mesh(fishGeometry, fishMaterial);
            fish.position.set(x, y, z);
            fish.rotation.z = Math.PI / 2;
            fish.userData.speed = 0.5 + Math.random() * 1;
            fish.userData.angle = Math.random() * Math.PI * 2;
            fish.userData.radius = 20 + Math.random() * 30;
            fish.userData.centerX = x;
            fish.userData.centerZ = z;
            return fish;
        }

        for (let i = 0; i < 30; i++) {
            const fish = createFish(
                Math.random() * 100 - 50,
                -10 - Math.random() * 30,
                Math.random() * 100 - 50
            );
            fishGroup.add(fish);
        }
        scene.add(fishGroup);

        // Coral/rocks on ocean floor
        function createCoral(x, z) {
            const coralGroup = new THREE.Group();
            const coralGeometry = new THREE.CylinderGeometry(0.5, 1, 3, 8);
            const coralMaterial = new THREE.MeshStandardMaterial({
                color: 0xff6b9d,
                roughness: 0.8
            });

            for (let i = 0; i < 3; i++) {
                const coral = new THREE.Mesh(coralGeometry, coralMaterial);
                coral.position.set(
                    Math.random() * 2 - 1,
                    Math.random() * 2,
                    Math.random() * 2 - 1
                );
                coral.rotation.x = Math.random() * 0.3 - 0.15;
                coral.rotation.z = Math.random() * 0.3 - 0.15;
                coralGroup.add(coral);
            }

            coralGroup.position.set(x, -48, z);
            return coralGroup;
        }

        for (let i = 0; i < 50; i++) {
            const coral = createCoral(
                Math.random() * 200 - 100,
                Math.random() * 200 - 100
            );
            scene.add(coral);
        }

        // Fog
        scene.fog = new THREE.FogExp2(0x001a33, 0.015);

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', () => {
            controls.lock();
            document.getElementById('instructions').style.display = 'none';
        });

        controls.addEventListener('lock', () => {
            document.getElementById('instructions').style.display = 'none';
        });

        controls.addEventListener('unlock', () => {
            document.getElementById('instructions').style.display = 'block';
        });

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
                case 'Space': keys.space = true; e.preventDefault(); break;
                case 'ShiftLeft':
                case 'ShiftRight': keys.shift = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
                case 'Space': keys.space = false; break;
                case 'ShiftLeft':
                case 'ShiftRight': keys.shift = false; break;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (controls.isLocked) {
                // Movement
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= velocity.y * 10.0 * delta;

                direction.z = Number(keys.w) - Number(keys.s);
                direction.x = Number(keys.a) - Number(keys.d);
                direction.y = Number(keys.space) - Number(keys.shift);
                direction.normalize();

                if (keys.w || keys.s) velocity.z -= direction.z * moveSpeed * delta;
                if (keys.a || keys.d) velocity.x -= direction.x * moveSpeed * delta;
                if (keys.space || keys.shift) velocity.y += direction.y * moveSpeed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                // Update environment based on position
                const isUnderwater = camera.position.y < waterLevel;

                if (isUnderwater) {
                    scene.fog.color.setHex(0x001a33);
                    scene.fog.density = 0.015;
                    scene.background = new THREE.Color(0x001a33);
                    document.getElementById('environment').textContent = 'Underwater';
                } else {
                    scene.fog.color.setHex(0x87ceeb);
                    scene.fog.density = 0.0001;
                    scene.background = new THREE.Color(0x87ceeb);
                    document.getElementById('environment').textContent = 'Above Water';
                }

                // Update UI
                document.getElementById('position').textContent =
                    `${camera.position.x.toFixed(1)}, ${camera.position.y.toFixed(1)}, ${camera.position.z.toFixed(1)}`;
                document.getElementById('depth').textContent =
                    `${(-camera.position.y).toFixed(1)}m`;
            }

            // Animate water surface
            for (let i = 0; i < waterPositions.count; i++) {
                const x = originalWaterPositions[i * 3];
                const y = originalWaterPositions[i * 3 + 1];
                const wave = Math.sin(x * 0.1 + time) * 0.5 + Math.cos(y * 0.1 + time) * 0.5;
                waterPositions.setZ(i, wave);
            }
            waterPositions.needsUpdate = true;
            waterGeometry.computeVertexNormals();

            // Animate particles
            const positions = particlesGeometry.attributes.position.array;
            for (let i = 0; i < particlesCount * 3; i += 3) {
                positions[i + 1] += velocityArray[i / 3] * delta * 10;

                if (positions[i + 1] > waterLevel) {
                    positions[i + 1] = -50;
                }
            }
            particlesGeometry.attributes.position.needsUpdate = true;

            // Animate fish
            fishGroup.children.forEach(fish => {
                fish.userData.angle += fish.userData.speed * delta;
                const newX = fish.userData.centerX + Math.cos(fish.userData.angle) * fish.userData.radius;
                const newZ = fish.userData.centerZ + Math.sin(fish.userData.angle) * fish.userData.radius;
                fish.position.x = newX;
                fish.position.z = newZ;

                const angle = Math.atan2(
                    Math.sin(fish.userData.angle),
                    Math.cos(fish.userData.angle)
                );
                fish.rotation.y = angle + Math.PI / 2;
            });

            // Animate clouds
            clouds.forEach((cloud, index) => {
                cloud.position.x += Math.sin(index + time * 0.1) * 0.02;
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
